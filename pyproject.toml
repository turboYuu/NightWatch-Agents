# 项目元数据与工具配置（见 doc/NightWatch产品说明.md 第 5 章 P0）
# 采用 src 布局：源码放 src/ 下，测试放 tests/，避免“测试时误导入工作目录版本”的经典坑。
#
# 本文件是依赖的**唯一声明来源**。conda-lock.yml 由它生成（见文件末尾 [tool.conda-lock]），
# 不要手工改锁文件里的版本；增删依赖的完整流程见 doc/依赖管理.md。

[build-system]
# 选 hatchling 是因为配置少：不像 setuptools 那样需要另写包发现规则。
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightwatch-agents"
version = "0.0.1"
description = "夜间维护者：把技术债 Issue 自动变成待人工确认的 PR 草案"
readme = "README.md"
# 这是**最低支持版本**，不是当前开发版本。实际锁定环境为 3.14
# （见文件末尾 [tool.conda-lock.dependencies]），ruff / mypy 也都按 3.11 语义检查，
# 以保证「声明的最低版本」确实能跑，而不是只在开发机上能跑。
requires-python = ">=3.11"
license = { file = "LICENSE" }   # 待正式打包发布时改用 PEP 639 的 SPDX 字符串写法
dependencies = [
    # 运行时依赖在 P0 逐步补齐；先放已确认存在的核心包。
    # 沙箱后端相关依赖在下面的 sandbox 组；增删依赖的完整流程见 doc/依赖管理.md。
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
sandbox = ["e2b>=1.0"]                                   # 云端沙箱后端（可选）
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]           # 开发工具

[project.scripts]
# 安装后即可用 `nw-agent ...` 调用（对应文档中的 CLI 入口）。
nw-agent = "nw_agent.cli.main:main"

[tool.hatch.build.targets.wheel]
# src 布局下必须显式指定包路径，否则 hatchling 找不到 src/ 里的包。
packages = ["src/nw_agent"]

# ---------------------------------------------------------------------------
# ruff：lint + import 排序
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# 按最低支持版本检查，避免写出 3.12+ 才有的语法、破坏 requires-python 的承诺。
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle / pyflakes / isort / pyupgrade / bugbear
# 注意：未启用 W（空白符）与 D（docstring）规则，故「文件末尾缺换行」等不会被拦下。

# ---------------------------------------------------------------------------
# mypy：静态类型检查
# ---------------------------------------------------------------------------
[tool.mypy]
# 与 ruff 同理，按最低支持版本检查。
python_version = "3.11"
# strict = true 是刻意的：P0 阶段人手少，靠类型检查守住模块边界比靠 code review 便宜。
strict = true
# 只检查源码，测试暂不纳入——不想为测试夹具写类型标注而拖慢 P0。
files = ["src"]

# ---------------------------------------------------------------------------
# pytest：把 src/ 加入导入路径，使测试无需先安装包即可运行
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# 把 src/ 加入导入路径，使测试无需先安装包即可运行。
# 副作用：pytest 通过**不能**证明 `pip install -e .` 装成功了——要验证安装是否可用，
# 请改用 `nw-agent --help`（见 doc/依赖管理.md 的验证一节）。
pythonpath = ["src"]
addopts = "-q"

# ---------------------------------------------------------------------------
# conda-lock：环境锁定
# ---------------------------------------------------------------------------
# 声明与锁定分离：本文件是唯一的依赖声明来源，`conda-lock lock` 据此生成
# conda-lock.yml（精确版本，提交进仓库）。加了新依赖后重跑：
#   conda run -n conda-lock conda-lock lock -f pyproject.toml
# 安装（仓库根目录执行；默认含 dev、不含 sandbox，需要沙箱时追加 -E sandbox）：
#   conda run -n conda-lock conda-lock install -n nightwatch_agents conda-lock.yml
#   pip install -e . --no-deps        # 本地包单独装，不参与锁定
#
# 注：conda-lock 本身装在独立的 `conda-lock` 环境里——它依赖的 packaging /
# requests / ruamel.yaml 版本与 conda 自身冲突，无法装进 base。
[tool.conda-lock]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
default-non-conda-source = "pip"     # [project].dependencies 一律按 pip 依赖处理

[tool.conda-lock.dependencies]       # 只有这里列出的走 conda
python = "3.14"
pip = "*"
